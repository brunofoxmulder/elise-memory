name: Agent Memory — comparaison vectorielle dev.3 / dev.4

# Compare le classement de dix questions entre dev.3 et dev.4 avec le MÊME
# fournisseur, le MÊME modèle et les MÊMES paramètres. La clé n'est jamais
# affichée, jamais écrite dans le dépôt : elle vient d'un secret de dépôt et
# n'existe que dans l'environnement des conteneurs, sur un runner jetable.
#
# Ce banc mesure le COMPORTEMENT DU CODE sur un corpus fictif de six souvenirs
# (dont la paire salon/terrasse). Il ne mesure pas la base réelle : celle-ci
# exige une sauvegarde de production et reste un test distinct.
on:
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Vérifier la présence du secret
        run: |
          if [ -z "${KEY}" ]; then
            echo "::warning::OPENAI_API_KEY absent des secrets du dépôt — comparaison non exécutée."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Récupérer dev.4 (cette branche)
        uses: actions/checkout@v4
        with:
          path: dev4

      - name: Récupérer dev.3 (branche de préparation)
        if: env.SKIP != '1'
        uses: actions/checkout@v4
        with:
          ref: prep/dev.3-reviewq-piece1
          path: dev3

      - name: Construire les deux images
        if: env.SKIP != '1'
        run: |
          set -eu
          docker build -t amem-dev4 ./dev4/agent-memory-mcp
          docker build -t amem-dev3 ./dev3/agent-memory-mcp
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}'

      - name: Mesurer dev.3
        if: env.SKIP != '1'
        run: |
          set -eu
          mkdir -p "${RUNNER_TEMP}/d3/data"
          docker run -d --name bench-dev3 --network host \
            -v "${RUNNER_TEMP}/d3/data:/data" \
            -e OPENAI_API_KEY="${KEY}" \
            -e MCP_EMBEDDING_MODE=auto -e MCP_EMBEDDING_DIMENSION=1024 \
            -e OPENAI_EMBEDDING_MODEL=text-embedding-3-small \
            -e MCP_HTTP_MODE=http -e MCP_HTTP_HOST=127.0.0.1 -e MCP_HTTP_PORT=18083 \
            -e MCP_HTTP_INSECURE_ALLOW_UNAUTHENTICATED=true \
            -e MCP_DATA_PATH=/data \
            --entrypoint /usr/local/bin/agent-memory-mcp amem-dev3
          python3 dev4/agent-memory-mcp/tests/bench_history.py http://127.0.0.1:18083/mcp dev3.json
          docker rm -f bench-dev3

      - name: Mesurer dev.4
        if: env.SKIP != '1'
        run: |
          set -eu
          mkdir -p "${RUNNER_TEMP}/d4/data"
          docker run -d --name bench-dev4 --network host \
            -v "${RUNNER_TEMP}/d4/data:/data" \
            -e OPENAI_API_KEY="${KEY}" \
            -e MCP_EMBEDDING_MODE=auto -e MCP_EMBEDDING_DIMENSION=1024 \
            -e OPENAI_EMBEDDING_MODEL=text-embedding-3-small \
            -e MCP_HTTP_MODE=http -e MCP_HTTP_HOST=127.0.0.1 -e MCP_HTTP_PORT=18084 \
            -e MCP_HTTP_INSECURE_ALLOW_UNAUTHENTICATED=true \
            -e MCP_DATA_PATH=/data \
            --entrypoint /usr/local/bin/agent-memory-mcp amem-dev4
          python3 dev4/agent-memory-mcp/tests/bench_history.py http://127.0.0.1:18084/mcp dev4.json
          docker rm -f bench-dev4

      - name: Comparer
        if: env.SKIP != '1'
        run: |
          set -eu
          python3 dev4/agent-memory-mcp/tests/compare_bench.py dev3.json dev4.json | tee comparaison.md
          cat comparaison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publier les résultats
        if: env.SKIP != '1'
        uses: actions/upload-artifact@v4
        with:
          name: comparaison-vectorielle
          path: |
            dev3.json
            dev4.json
            comparaison.md
