name: Élise Memory package validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the exact package shipped in the HA app
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./elise-memory/app[test]"
      - name: Compile shipped package
        run: python -m compileall -q elise-memory/app/elise_memory tests
      - name: Run regression suite against shipped package
        env:
          PYTHONPATH: elise-memory/app
        run: python -m pytest -q tests

  ha-app-smoke:
    needs: python-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the actual Home Assistant app image
        run: |
          docker build             --build-arg BUILD_VERSION=0.1.0-dev.17             --build-arg BUILD_ARCH=amd64             -t elise-memory-dev17 ./elise-memory
      - name: Smoke test with sync disabled
        run: |
          mkdir -p .ci/data-disabled .ci/config-disabled
          printf '%s' '{"sync_enabled":false,"sheet_home_assistant_id":"","sheet_index_id":"","sheet_automations_id":"","sheet_scripts_id":""}' > .ci/data-disabled/options.json
          docker run -d --name elise-memory-disabled -p 18099:8099             -v "$PWD/.ci/data-disabled:/data"             -v "$PWD/.ci/config-disabled:/config:ro"             elise-memory-dev17
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18099/health > .ci/health-disabled.json && break
            sleep 1
          done
          python - <<'PY'
          import json
          data=json.load(open(".ci/health-disabled.json", encoding="utf-8"))
          assert data == {"status":"ok","mode":"isolated","version":"0.1.0-dev.17","sync":"disabled"}, data
          PY
          docker rm -f elise-memory-disabled
      - name: Smoke test missing credentials is non-fatal
        env:
          ELISE_MEMORY_ADMIN_TOKEN: ci-only-dummy-administration-token-not-for-deployment
        run: |
          mkdir -p .ci/data-missing .ci/config-missing
          printf '%s' '{"sync_enabled":true,"sheet_home_assistant_id":"ha","sheet_index_id":"index","sheet_automations_id":"automations","sheet_scripts_id":"scripts"}' > .ci/data-missing/options.json
          docker run -d --name elise-memory-missing -p 18100:8099 -e ELISE_MEMORY_ADMIN_TOKEN             -v "$PWD/.ci/data-missing:/data"             -v "$PWD/.ci/config-missing:/config:ro"             elise-memory-dev17
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18100/health > .ci/health-missing.json && break
            sleep 1
          done
          python - <<'PY'
          import json
          data=json.load(open(".ci/health-missing.json", encoding="utf-8"))
          assert data == {"status":"ok","mode":"isolated","version":"0.1.0-dev.17","sync":"not_ready"}, data
          PY
          test "$(docker inspect -f '{{.State.Running}}' elise-memory-missing)" = "true"
          code=$(curl -sS -o .ci/manual-sync.json -w '%{http_code}' -H "Authorization: Bearer $ELISE_MEMORY_ADMIN_TOKEN" -X POST http://127.0.0.1:18100/v1/sync/run)
          test "$code" = "503"
          python - <<'PY'
          import json
          data=json.load(open(".ci/manual-sync.json", encoding="utf-8"))
          assert data["detail"] != "administrative writes disabled", data
          PY
          test "$(docker inspect -f '{{.State.Running}}' elise-memory-missing)" = "true"
          docker rm -f elise-memory-missing
