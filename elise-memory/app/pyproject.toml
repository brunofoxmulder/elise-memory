[project]
name = "elise-memory"
version = "0.1.0-dev.13"
description = "Local deterministic memory service for Home Assistant"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3",
  "google-api-python-client>=2.0,<3",
  "google-auth>=2.0,<3",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[project.scripts]
elise-memory = "elise_memory.__main__:main"
